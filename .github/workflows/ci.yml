name: Enhanced CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: enhanced-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code formatting check (Black)
        run: black --check --diff .

      - name: Linting (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --statistics

      - name: Type checking (MyPy)
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports --disallow-untyped-defs \
            botnet_controller.py botnet_server_enhanced.py utils.py

      - name: Security scanning (Bandit)
        if: matrix.python-version == '3.12'
        run: |
          bandit -r . \
            --exclude ./venv,./.venv,./env,./.env,./.git,./__pycache__,./.pytest_cache \
            --skip B108 -f json -o bandit-report.json || true
          bandit -r . \
            --exclude ./venv,./.venv,./env,./.env,./.git,./__pycache__,./.pytest_cache \
            --skip B108 --severity-level medium --confidence-level medium

      - name: Dependency security check (pip-audit)
        if: matrix.python-version == '3.12'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
          if pip-audit -r requirements.txt; then
            echo "pip-audit: no known vulnerabilities"
          else
            echo "pip-audit reported issues (non-blocking; see artifact)"
          fi

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=. --cov-report=xml --cov-report=term \
            -v --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload security reports
        uses: actions/upload-artifact@v5
        if: always() && matrix.python-version == '3.12'
        with:
          name: security-reports-${{ matrix.python-version }}
          path: |
            bandit-report.json
            pip-audit-report.json
            coverage.xml
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test imports and basic functionality
        run: |
          python -c "import utils; print('Utils module imports successfully')"
          python -c "import botnet_controller; print('Controller module imports successfully')"
          python -c "import botnet_server_enhanced; print('Enhanced server module imports successfully')"

      - name: Test encryption functionality
        run: |
          python -c "
          from utils import SecureEncryption
          enc = SecureEncryption()
          data = b'test data'
          encrypted = enc.encrypt(data)
          decrypted = enc.decrypt(encrypted)
          assert decrypted == data
          print('Encryption tests pass')
          "

      - name: Test configuration management
        run: |
          python -c "
          import os
          from utils import SecureConfig
          os.environ['BOTNET_HOST'] = '127.0.0.1'
          os.environ['BOTNET_PORT'] = '8080'
          config = SecureConfig()
          assert config.get('SERVER_HOST') == '127.0.0.1'
          assert config.get('SERVER_PORT') == 8080
          print('Configuration tests pass')
          "

      - name: Performance benchmarks
        run: |
          python -c "
          import time
          import asyncio
          from utils import SecureEncryption, BotTracker

          enc = SecureEncryption()
          start = time.time()
          for i in range(1000):
              encrypted = enc.encrypt(b'benchmark data')
              decrypted = enc.decrypt(encrypted)
          enc_time = time.time() - start
          print(f'Encryption benchmark: {enc_time:.3f}s for 1000 ops')

          async def track_test():
              tracker = BotTracker()
              start = time.time()
              for i in range(100):
                  await tracker.add_bot(f'bot_{i}', f'192.168.1.{i % 255}')
              track_time = time.time() - start
              print(f'Bot tracking benchmark: {track_time:.3f}s for 100 bots')

          asyncio.run(track_test())
          "

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Advanced security scan (Bandit)
        run: |
          bandit -r . \
            --exclude ./venv,./.venv,./env,./.env,./.git,./__pycache__,./.pytest_cache \
            --skip B108 -f json -o bandit-detailed.json || true
          bandit -r . \
            --exclude ./venv,./.venv,./env,./.env,./.git,./__pycache__,./.pytest_cache \
            --skip B108 --severity-level medium --confidence-level medium

      - name: Semgrep security scan
        run: |
          semgrep --config=auto . \
            --exclude-dir env --exclude-dir venv --exclude-dir .venv \
            --json --output=semgrep-report.json || true
          if semgrep --config=auto . \
            --exclude-dir env --exclude-dir venv --exclude-dir .venv \
            --severity=ERROR; then
            echo "Semgrep: no ERROR findings"
          else
            echo "Semgrep reported ERROR findings (non-blocking; see artifact)"
          fi

      - name: Optional Safety scan
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          if [ -z "$SAFETY_API_KEY" ]; then
            echo "SAFETY_API_KEY not set; skipping Safety (pip-audit covers deps)"
            exit 0
          fi
          pip install safety
          safety scan --output json > safety-report.json || true
          safety scan || echo "Safety scan reported issues (non-blocking)"

      - name: Dependency audit (pip-audit)
        run: |
          if pip-audit -r requirements.txt; then
            echo "pip-audit: no known vulnerabilities"
          else
            echo "pip-audit reported issues (non-blocking)"
          fi

      - name: Check for hardcoded secrets
        run: |
          grep -r -n -i -E "password|secret|key|token" \
            --exclude-dir=.git --exclude-dir=env --exclude-dir=venv \
            --exclude-dir=.venv --exclude="*.json" --exclude=".env" . \
            || echo "No obvious hardcoded secrets found"

      - name: Validate no XOR encryption usage
        run: |
          # Flag bitwise XOR in application Python only — docs and the
          # deprecated xor_encrypt stub are allowed to mention XOR.
          matches="$(grep -RIn --include='*.py' -E '[^#].*[[:space:]]\^[[:space:]]' \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=venv \
            --exclude-dir=.pytest_cache --exclude-dir=tests . || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Bitwise XOR found in application code (insecure for encryption)"
            exit 1
          fi
          echo "No XOR encryption implementations in application code"

      - name: Check for secure defaults
        run: |
          python -c "
          from utils import SecureConfig, SecureEncryption

          config = SecureConfig()
          assert config.get('SERVER_HOST') == '127.0.0.1'
          assert config.get('LOG_LEVEL') == 'INFO'

          key = config.get_encryption_key()
          assert len(key) == 32

          print('Secure defaults validated')
          "

      - name: Upload security artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-audit-reports
          path: |
            bandit-detailed.json
            semgrep-report.json
            safety-report.json
          if-no-files-found: ignore

  documentation-check:
    name: Documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check documentation completeness
        run: |
          missing=0
          for f in README.md LICENSE requirements.txt .gitignore; do
            if [ ! -f "$f" ]; then
              echo "Missing $f"
              missing=1
            else
              echo "Found $f"
            fi
          done
          exit "$missing"

      - name: Check docstring coverage
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pydocstyle
          pydocstyle . || true
          mkdir -p docs
          python -c 'from pathlib import Path; Path("docs/docstring.svg").write_text("<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"180\" height=\"20\"><rect width=\"180\" height=\"20\" rx=\"3\" fill=\"#555\"/><text x=\"90\" y=\"14\" fill=\"#fff\" text-anchor=\"middle\" font-size=\"11\" font-family=\"Verdana,sans-serif\">docstrings checked</text></svg>")'
          test -f docs/docstring.svg

      - name: Upload docstring badge
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: docstring-badge
          path: docs/docstring.svg
          if-no-files-found: ignore

  final-validation:
    name: Final validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality, integration-tests, security-audit, documentation-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Final comprehensive test
        run: python -m pytest -v --tb=short

      - name: Validate core components
        run: |
          python -c "
          from utils import SecureConfig, SecureEncryption, InputValidator, SecureLogger, BotTracker
          import botnet_controller
          import botnet_server_enhanced

          config = SecureConfig()
          encryption = SecureEncryption()
          validator = InputValidator()
          logger = SecureLogger('validation', 'INFO')
          tracker = BotTracker()

          test_data = b'validation test'
          assert encryption.decrypt(encryption.encrypt(test_data)) == test_data
          assert validator.validate_ip_address('127.0.0.1')
          assert validator.validate_port(9999)

          controller = botnet_controller.BotnetController()
          assert hasattr(controller, 'encryption')
          assert hasattr(controller, 'bot_tracker')

          server = botnet_server_enhanced.EnhancedBotnetServer()
          assert hasattr(server, 'encryption')
          assert hasattr(server, 'bot_tracker')

          print('All core components validated')
          "
